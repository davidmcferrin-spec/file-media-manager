<VirtualHost *:80>
    ServerName media-manager.local
    DocumentRoot /var/www/file-media-manager/public

    <Directory /var/www/file-media-manager/public>
        AllowOverride All
        Require all granted
        Options -Indexes

        # Front controller — route everything through index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Block direct access to sensitive directories
    <DirectoryMatch "^/var/www/file-media-manager/(src|data|sql|storage|uploads)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/media-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/media-manager-access.log combined
</VirtualHost>
